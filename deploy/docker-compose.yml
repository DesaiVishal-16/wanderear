services:
  gallery:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      WANDEREAR_HOME: /data
      HOST: 0.0.0.0
      PORT: 8000
      # WANDEREAR_SYNC_TOKEN: change-me
    volumes:
      - wanderear-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  wanderear-data:
