# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads
# this file from the repository root and provisions the gallery below.
#
# Postcards are stored on a persistent disk mounted at /data, so they survive
# redeploys and restarts. The free plan does not support disks; switch
# `plan: starter` to `plan: free` and delete the `disk:` block only if you are
# fine with ephemeral storage (the gallery resets on every deploy).
services:
  - type: web
    name: wanderear-gallery
    runtime: docker
    plan: starter
    region: oregon
    dockerContext: .
    dockerfilePath: ./deploy/Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WANDEREAR_HOME
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      # Optional: set a secret to lock down POST /api/postcards and
      # POST /api/media/* (used by `wanderear sync`). Leave unset for an open
      # demo gallery. If set, sync with: WANDEREAR_SYNC_TOKEN=... wanderear sync <url>
      - key: WANDEREAR_SYNC_TOKEN
        sync: false
    disk:
      name: postcards
      mountPath: /data
      sizeGB: 1
