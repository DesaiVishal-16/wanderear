# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Render reads
# this file from the repository root and provisions the gallery below.
#
# This uses Render's FREE web service, which does NOT require a credit card.
# (A card is only requested if you pick a paid compute plan or attach a disk.)
# Free services spin down after 15 min idle and take ~1 min to wake; the
# filesystem is ephemeral, so postcards reset on redeploy/restart. For durable
# postcards, set WANDEREAR_MONGO_URI to a free MongoDB Atlas cluster instead.
#
# Want persistence on Render? Upgrade to a paid plan and re-add:
#   plan: starter
#   disk: {name: postcards, mountPath: /data, sizeGB: 1}
services:
  - type: web
    name: wanderear-gallery
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WANDEREAR_HOME
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      # Optional: set a secret to lock down POST /api/postcards and
      # POST /api/media/* (used by `wanderear sync`). Leave unset for an open
      # demo gallery. If set, sync with: WANDEREAR_SYNC_TOKEN=... wanderear sync <url>
      - key: WANDEREAR_SYNC_TOKEN
        sync: false
